<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Sei offline · FinTrack</title>
    <style>
      :root {
        --bg: #fafafa;
        --card: #ffffff;
        --fg: #171717;
        --muted: #737373;
        --border: #e5e5e5;
        --button: #171717;
        --button-fg: #fafafa;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --card: #171717;
          --fg: #fafafa;
          --muted: #a3a3a3;
          --border: #262626;
          --button: #fafafa;
          --button-fg: #171717;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 380px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 28px;
        text-align: center;
      }
      svg {
        width: 56px;
        height: 56px;
        margin-bottom: 12px;
        color: var(--muted);
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
      }
      a {
        border: 1px solid var(--border);
        color: var(--fg);
        border-radius: 10px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
      button {
        background: var(--button);
        color: var(--button-fg);
        border: 0;
        border-radius: 10px;
        padding: 11px 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        aria-hidden="true"
      >
        <path
          d="M12 20h.01M8.5 16.4a5 5 0 0 1 7 0M2 8.8a15 15 0 0 1 4.2-2.7M22 8.8a15 15 0 0 0-11.3-3.8M5 12.9a10 10 0 0 1 5.2-2.8M19 12.9a10 10 0 0 0-2.8-1.9M2 2l20 20"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <h1>Sei offline</h1>
      <p>
        Questa pagina non è ancora disponibile senza connessione. Le pagine che hai già aperto
        restano consultabili, e i movimenti che registri vengono sincronizzati appena torni online.
      </p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Riprova</button>
        <a href="/dashboard">Vai alla dashboard</a>
      </div>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
